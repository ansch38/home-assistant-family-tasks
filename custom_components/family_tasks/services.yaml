add_person:
  fields:
    name:
      required: true
      selector:
        text:
add_task:
  fields:
    title:
      required: true
      selector:
        text:
    person:
      required: true
      selector:
        text:
    frequency:
      required: true
      selector:
        select:
          options:
            - daily
            - weekly
            - monthly
            - yearly
            - once
          translation_key: frequency
    time_of_day:
      selector:
        select:
          options:
            - label: Morgens
              value: morning
            - label: Tagsüber
              value: daytime
            - label: Abends
              value: evening
            - label: Ohne Zuordnung
              value: anytime
    missed_behavior:
      selector:
        select:
          options:
            - label: Verwerfen
              value: discard
            - label: Archivieren
              value: archive
            - label: Offen lassen
              value: keep
    weekdays:
      selector:
        text:
    month:
      selector:
        number:
          min: 1
          max: 12
          mode: box
    day:
      selector:
        number:
          min: 1
          max: 31
          mode: box
    start:
      description: Start date for recurring tasks; required due date for one-off tasks.
      selector:
        date:
delete_task:
  fields:
    task_id:
      required: true
      selector:
        text:

update_task:
  fields:
    task_id:
      required: true
      selector:
        text:
    title:
      required: true
      selector:
        text:
    person:
      required: true
      selector:
        text:
    frequency:
      required: true
      selector:
        select:
          options: [daily, weekly, monthly, yearly, once]
          translation_key: frequency
    time_of_day:
      selector:
        select:
          options: [morning, daytime, evening, anytime]
    missed_behavior:
      selector:
        select:
          options:
            - label: Verwerfen
              value: discard
            - label: Archivieren
              value: archive
            - label: Offen lassen
              value: keep
    weekdays:
      selector:
        text:
    month:
      selector:
        number:
          min: 1
          max: 12
          mode: box
    day:
      selector:
        number:
          min: 1
          max: 31
    start:
      description: New due date for an open one-off task. Completed and archived dates are protected.
      selector:
        date:
